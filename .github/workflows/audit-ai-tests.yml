name: AUDIT AI 3.3 Tests

on:
  push:
    branches:
      - audit-ai-3.3-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile business_analyzer.py
          python -m py_compile strategy_engine_3_3.py
          python -m py_compile strategy_pdf.py
          python -m py_compile test_strategy_integration.py

      - name: Run integration tests
        run: |
          python -m unittest discover -p "test_*.py" -v
